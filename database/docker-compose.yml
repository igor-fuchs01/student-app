# Local PostgreSQL for the schema in this folder. From the project root:
#
#   docker compose -f database/docker-compose.yml up -d
#
# On first run, the official Postgres image executes every *.sql file bind-
# mounted into /docker-entrypoint-initdb.d, in name order — so schema.sql
# creates the tables and seed.sql fills them, with no manual psql step. It
# only runs once, on an empty data volume: to re-seed, run reset.sql and then
# seed.sql, or recreate the volume with `down -v`.
#
# Credentials are plain and local-only, matching docs/06-modelagem-de-dados.md.

# Fixed project name, so container and volume names don't depend on the folder.
name: student-app

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: student_app
      POSTGRES_PASSWORD: student_app
      POSTGRES_DB: student_app
    ports:
      - "5432:5432"
    volumes:
      - student_app_db:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U student_app -d student_app"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  student_app_db:
